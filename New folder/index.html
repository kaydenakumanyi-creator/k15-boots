<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>K15 Boots Comparison</title>

<style>

/* =====================================================
   THEME VARIABLES
===================================================== */

:root {
  color-scheme: light dark;

  --background: #191919;
  --surface: #242424;
  --surface-hover: #303030;

  --text: #ffffff;
  --text-secondary: #999999;

  --border: #3a3a3a;

  --input-background: #242424;

  --button-background: #ffffff;
  --button-text: #191919;

  --shadow: rgba(0,0,0,0.35);
}


/* =====================================================
   AUTOMATIC LIGHT MODE
===================================================== */

@media (prefers-color-scheme: light) {

  :root {

    --background: #f2f2f2;
    --surface: #ffffff;
    --surface-hover: #f3f3f3;

    --text: #191919;
    --text-secondary: #707070;

    --border: #dddddd;

    --input-background: #f7f7f7;

    --button-background: #191919;
    --button-text: #ffffff;

    --shadow: rgba(0,0,0,0.12);

  }

}


/* =====================================================
   GLOBAL
===================================================== */

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  padding: 40px 20px;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background:
    var(--background);

  color:
    var(--text);

  transition:
    background 0.3s ease,
    color 0.3s ease;

}


/* =====================================================
   CONTAINER
===================================================== */

.comparison-container {

  max-width: 1000px;

  margin: auto;

}


/* =====================================================
   SEARCH AREA
===================================================== */

.boot-selection {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 20px;

  margin-bottom: 25px;

}


.boot-selector {

  position: relative;

}


.boot-selector h3 {

  margin:
    0 0 10px;

  font-size: 16px;

  font-weight: 600;

  color:
    var(--text);

}


/* =====================================================
   SEARCH BOX
===================================================== */

.search-wrapper {

  position: relative;

}


.boot-search {

  width: 100%;

  padding:
    15px 17px;

  border:
    1px solid var(--border);

  border-radius:
    13px;

  background:
    var(--input-background);

  color:
    var(--text);

  font-size:
    15px;

  outline:
    none;

  transition:
    border 0.2s ease,
    box-shadow 0.2s ease,
    background 0.3s ease,
    color 0.3s ease;

}


.boot-search::placeholder {

  color:
    var(--text-secondary);

}


.boot-search:focus {

  border-color:
    #888;

  box-shadow:
    0 0 0 3px rgba(128,128,128,0.15);

}


/* =====================================================
   SUGGESTIONS
===================================================== */

.suggestions {

  position:
    absolute;

  top:
    calc(100% + 7px);

  left:
    0;

  right:
    0;

  background:
    var(--surface);

  border:
    1px solid var(--border);

  border-radius:
    14px;

  box-shadow:
    0 12px 35px var(--shadow);

  overflow:
    hidden;

  z-index:
    100;

  display:
    none;

  max-height:
    350px;

  overflow-y:
    auto;

}


.suggestions.show {

  display:
    block;

}


.suggestion {

  display:
    flex;

  align-items:
    center;

  gap:
    14px;

  padding:
    12px 14px;

  cursor:
    pointer;

  transition:
    background 0.15s ease;

}


.suggestion:hover {

  background:
    var(--surface-hover);

}


.suggestion img {

  width:
    65px;

  height:
    50px;

  object-fit:
    contain;

  border-radius:
    8px;

  background:
    #ffffff;

}


.suggestion-placeholder {

  width:
    65px;

  height:
    50px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  border-radius:
    8px;

  background:
    #ffffff;

  font-size:
    24px;

}


.suggestion-info {

  display:
    flex;

  flex-direction:
    column;

  gap:
    4px;

}


.suggestion-name {

  font-size:
    14px;

  font-weight:
    600;

  color:
    var(--text);

}


.suggestion-brand {

  font-size:
    12px;

  color:
    var(--text-secondary);

}


/* =====================================================
   SELECTED BOOT
===================================================== */

.selected-boot {

  display:
    none;

  margin-top:
    10px;

  padding:
    10px;

  border-radius:
    13px;

  background:
    var(--surface);

  border:
    1px solid var(--border);

  align-items:
    center;

  gap:
    12px;

}


.selected-boot.show {

  display:
    flex;

}


.selected-boot img {

  width:
    70px;

  height:
    55px;

  object-fit:
    contain;

  background:
    #ffffff;

  border-radius:
    8px;

}


.selected-placeholder {

  width:
    70px;

  height:
    55px;

  display:
    flex;

  align-items:
    center;

  justify-content:
    center;

  background:
    #ffffff;

  border-radius:
    8px;

  font-size:
    25px;

  text-decoration:
    none;

}


.selected-info {

  flex:
    1;

}


.selected-name {

  font-weight:
    600;

  font-size:
    14px;

  color:
    var(--text);

}


.selected-brand {

  color:
    var(--text-secondary);

  font-size:
    12px;

  margin-top:
    4px;

}


.remove-boot {

  border:
    none;

  background:
    transparent;

  cursor:
    pointer;

  font-size:
    18px;

  color:
    var(--text-secondary);

  transition:
    color 0.2s ease;

}


.remove-boot:hover {

  color:
    var(--text);

}


/* =====================================================
   COMPARE BUTTON
===================================================== */

.compare-container {

  width:
    100%;

  display:
    flex;

  justify-content:
    center;

  margin:
    20px 0 35px;

}


.compare-button {

  position:
    relative;

  overflow:
    hidden;

  border:
    1px solid var(--border);

  outline:
    none;

  cursor:
    pointer;

  color:
    var(--button-text);

  background:
    var(--button-background);

  padding:
    15px 36px;

  font-size:
    16px;

  font-weight:
    700;

  border-radius:
    13px;

  box-shadow:
    0 6px 20px var(--shadow),
    0 0 18px rgba(128,128,128,0.15);

  transition:
    transform 0.25s ease,
    box-shadow 0.25s ease,
    border-color 0.25s ease,
    background 0.3s ease,
    color 0.3s ease;

}


/* =====================================================
   MOUSE FOLLOWING GLOW
===================================================== */

.compare-button::before {

  content:
    "";

  position:
    absolute;

  width:
    150px;

  height:
    150px;

  left:
    var(--mouse-x, 50%);

  top:
    var(--mouse-y, 50%);

  transform:
    translate(-50%, -50%);

  background:
    radial-gradient(
      circle,
      rgba(255,255,255,0.9),
      rgba(255,255,255,0.35) 30%,
      transparent 70%
    );

  opacity:
    0;

  pointer-events:
    none;

  transition:
    opacity 0.15s ease;

}


.compare-button:hover::before {

  opacity:
    1;

}


/* =====================================================
   BUTTON HOVER
===================================================== */

.compare-button:hover {

  transform:
    translateY(-2px);

  border-color:
    #888;

  box-shadow:

    0 8px 25px var(--shadow),

    0 0 8px rgba(255,255,255,0.45),

    0 0 22px rgba(255,255,255,0.35),

    0 0 45px rgba(255,255,255,0.18);

}


/* =====================================================
   NEON CLICK EFFECT
===================================================== */

.compare-button.neon {

  animation:
    neonPulse 0.7s ease-out;

}


@keyframes neonPulse {

  0% {

    box-shadow:
      0 0 5px rgba(128,128,128,0.2);

  }

  40% {

    box-shadow:

      0 0 8px rgba(255,255,255,0.9),

      0 0 20px rgba(255,255,255,0.8),

      0 0 40px rgba(255,255,255,0.6),

      0 0 70px rgba(255,255,255,0.35);

  }

  100% {

    box-shadow:
      0 0 0 rgba(255,255,255,0);

  }

}


/* =====================================================
   RESULTS
===================================================== */

.comparison-result {

  display:
    none;

  margin-top:
    20px;

  animation:
    fadeIn 0.4s ease;

}


.comparison-result.show {

  display:
    block;

}


@keyframes fadeIn {

  from {

    opacity:
      0;

    transform:
      translateY(10px);

  }

  to {

    opacity:
      1;

    transform:
      translateY(0);

  }

}


/* =====================================================
   BOOT CARDS
===================================================== */

.boots {

  display:
    grid;

  grid-template-columns:
    1fr 1fr;

  gap:
    20px;

}


.boot-card {

  background:
    var(--surface);

  border:
    1px solid var(--border);

  border-radius:
    18px;

  padding:
    25px;

  box-shadow:
    0 5px 20px var(--shadow);

  transition:
    background 0.3s ease,
    border 0.3s ease,
    box-shadow 0.3s ease;

}


.boot-card h2 {

  margin-top:
    0;

  font-size:
    22px;

  color:
    var(--text);

}


.result-image {

  width:
    100%;

  height:
    180px;

  object-fit:
    contain;

  margin-bottom:
    10px;

}


/* =====================================================
   STATS
===================================================== */

.stat {

  display:
    flex;

  justify-content:
    space-between;

  padding:
    13px 0;

  border-bottom:
    1px solid var(--border);

  font-size:
    15px;

}


.stat:last-child {

  border-bottom:
    none;

}


.stat-name {

  color:
    var(--text-secondary);

}


.stat-value {

  font-weight:
    600;

  color:
    var(--text);

  text-align:
    right;

  max-width:
    60%;

}


/* =====================================================
   WINNER
===================================================== */

.winner {

  margin-top:
    20px;

  padding:
    15px;

  background:
    var(--surface);

  border:
    1px solid var(--border);

  border-radius:
    12px;

  text-align:
    center;

  font-weight:
    600;

  color:
    var(--text);

  box-shadow:
    0 5px 20px var(--shadow);

}


/* =====================================================
   PRODUCT LINK
===================================================== */

.product-link {

  display:
    block;

  text-align:
    center;

  padding:
    12px;

  margin-bottom:
    15px;

  background:
    var(--button-background);

  border-radius:
    10px;

  color:
    var(--button-text);

  text-decoration:
    none;

  font-weight:
    600;

  transition:
    background 0.2s ease,
    transform 0.2s ease;

}


.product-link:hover {

  transform:
    translateY(-1px);

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 700px) {

  .boot-selection,
  .boots {

    grid-template-columns:
      1fr;

  }

  body {

    padding:
      25px 15px;

  }

  .boot-card {

    padding:
      20px;

  }

}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media (prefers-reduced-motion: reduce) {

  *,
  *::before,
  *::after {

    animation-duration:
      0.01ms !important;

    animation-iteration-count:
      1 !important;

    transition-duration:
      0.01ms !important;

  }

}

</style>

</head>

<script>


/* =====================================================
   FOOTBALL BOOT DATABASE
===================================================== */

const boots = [

  {
    name:
      "Nike Mercurial Superfly 11 Elite FG",

    brand:
      "Nike",

    productPage:
      "https://www.nike.com/gb/t/mercurial-superfly-11-elite-firm-ground-low-top-football-boots-kSXagTAt/IF8507-101",

    image:
      "",

    speed:
      "10/10",

    control:
      "8.5/10",

    comfort:
      "8.5/10",

    weight:
      "170g",

    price:
      "£254.99–£264.99",

    surface:
      "Firm Ground (FG)",

    technology:
      "Forefoot Air Zoom + ZoomX foam + FlyWeave Ultra"

  },


  {
    name:
      "Nike Mercurial Vapor 16 Elite FG",

    brand:
      "Nike",

    image:
      "https://static.nike.com/a/images/t_web_pw_592_v2/f_auto/88c36b8b-d410-4974-807b-86277e4181b4/ZM+VAPOR+16+ELITE+FG.png",

    productPage:
      "https://www.nike.com/gb/",

    speed:
      "9.5/10",

    control:
      "9/10",

    comfort:
      "8/10",

    weight:
      "178g",

    price:
      "£234.99–£244.99",

    surface:
      "Firm Ground (FG)",

    technology:
      "3/4-length Air Zoom + Vaporposite+"

  }

];


/* =====================================================
   SELECTED BOOTS
===================================================== */

let selectedBoot1 =
  null;

let selectedBoot2 =
  null;


/* =====================================================
   SHOW SUGGESTIONS
===================================================== */

function showSuggestions(
  searchInput,
  suggestionsBox,
  selectionNumber
) {

  const search =
    searchInput.value
      .toLowerCase()
      .trim();


  suggestionsBox.innerHTML =
    "";


  const matches =
    boots.filter(
      boot =>

        boot.name
          .toLowerCase()
          .includes(search)

        ||

        boot.brand
          .toLowerCase()
          .includes(search)

    );


  if (
    matches.length === 0
  ) {

    suggestionsBox.innerHTML = `

      <div style="
        padding:18px;
        text-align:center;
        color:#888;
        font-size:14px;
      ">

        No boots found

      </div>

    `;

    suggestionsBox
      .classList
      .add("show");

    return;

  }


  matches.forEach(
    boot => {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "suggestion";


      const imageHTML =
        boot.image

        ?

        `
        <img
          src="${boot.image}"
          alt="${boot.name}"
        >
        `

        :

        `
        <div
          class="suggestion-placeholder">

          👟

        </div>

        `;


      item.innerHTML = `

        ${imageHTML}

        <div class="suggestion-info">

          <div class="suggestion-name">

            ${boot.name}

          </div>

          <div class="suggestion-brand">

            ${boot.brand}

          </div>

        </div>

      `;


      item.addEventListener(
        "click",
        function() {

          selectBoot(
            boot,
            selectionNumber
          );

        }
      );


      suggestionsBox.appendChild(
        item
      );

    }
  );


  suggestionsBox
    .classList
    .add("show");

}


/* =====================================================
   SELECT BOOT
===================================================== */

function selectBoot(
  boot,
  selectionNumber
) {


  if (
    selectionNumber === 1
  ) {

    selectedBoot1 =
      boot;


    document
      .getElementById(
        "search1"
      )
      .value =
      "";


    document
      .getElementById(
        "suggestions1"
      )
      .classList
      .remove("show");


    showSelectedBoot(
      boot,
      "selected1"
    );

  }


  if (
    selectionNumber === 2
  ) {

    selectedBoot2 =
      boot;


    document
      .getElementById(
        "search2"
      )
      .value =
      "";


    document
      .getElementById(
        "suggestions2"
      )
      .classList
      .remove("show");


    showSelectedBoot(
      boot,
      "selected2"
    );

  }

}


/* =====================================================
   SHOW SELECTED BOOT
===================================================== */

function showSelectedBoot(
  boot,
  elementId
) {

  const element =
    document.getElementById(
      elementId
    );


  let imageHTML =
    "";


  if (
    boot.image
  ) {

    imageHTML = `

      <img
        src="${boot.image}"
        alt="${boot.name}"
      >

    `;

  }

  else {

    imageHTML = `

      <a
        href="${boot.productPage || '#'}"
        target="_blank"
        rel="noopener noreferrer"
        class="selected-placeholder"
        title="View boot product page">

        👟

      </a>

    `;

  }


  element.innerHTML = `

    ${imageHTML}

    <div class="selected-info">

      <div class="selected-name">

        ${boot.name}

      </div>

      <div class="selected-brand">

        ${boot.brand}

      </div>

    </div>

    <button
      class="remove-boot"
      onclick="removeBoot('${elementId}')"
      aria-label="Remove boot">

      ×

    </button>

  `;


  element
    .classList
    .add("show");

}


/* =====================================================
   REMOVE BOOT
===================================================== */

function removeBoot(
  elementId
) {

  const element =
    document.getElementById(
      elementId
    );


  element.innerHTML =
    "";


  element
    .classList
    .remove("show");


  if (
    elementId ===
    "selected1"
  ) {

    selectedBoot1 =
      null;

  }


  if (
    elementId ===
    "selected2"
  ) {

    selectedBoot2 =
      null;

  }

}


/* =====================================================
   SEARCH EVENTS
===================================================== */

document
  .getElementById(
    "search1"
  )
  .addEventListener(
    "input",
    function() {

      showSuggestions(

        this,

        document.getElementById(
          "suggestions1"
        ),

        1

      );

    }
  );


document
  .getElementById(
    "search2"
  )
  .addEventListener(
    "input",
    function() {

      showSuggestions(

        this,

        document.getElementById(
          "suggestions2"
        ),

        2

      );

    }
  );


/* =====================================================
   FOCUS EVENTS
===================================================== */

document
  .getElementById(
    "search1"
  )
  .addEventListener(
    "focus",
    function() {

      showSuggestions(

        this,

        document.getElementById(
          "suggestions1"
        ),

        1

      );

    }
  );


document
  .getElementById(
    "search2"
  )
  .addEventListener(
    "focus",
    function() {

      showSuggestions(

        this,

        document.getElementById(
          "suggestions2"
        ),

        2

      );

    }
  );


/* =====================================================
   MOUSE FOLLOWING GLOW
===================================================== */

const compareButton =
  document.getElementById(
    "compareButton"
  );


compareButton.addEventListener(
  "mousemove",
  function(event) {

    const rect =
      compareButton
        .getBoundingClientRect();


    const x =
      event.clientX -
      rect.left;


    const y =
      event.clientY -
      rect.top;


    compareButton.style.setProperty(
      "--mouse-x",
      x + "px"
    );


    compareButton.style.setProperty(
      "--mouse-y",
      y + "px"
    );

  }
);


/* =====================================================
   COMPARE
===================================================== */

compareButton.addEventListener(
  "click",
  function() {


    compareButton
      .classList
      .remove("neon");


    void compareButton.offsetWidth;


    compareButton
      .classList
      .add("neon");


    if (
      !selectedBoot1 ||
      !selectedBoot2
    ) {

      alert(
        "Please select two boots first."
      );

      return;

    }


    updateResult(
      selectedBoot1,
      1
    );


    updateResult(
      selectedBoot2,
      2
    );


    document
      .getElementById(
        "comparisonResult"
      )
      .classList
      .add("show");


    document
      .getElementById(
        "winner"
      )
      .textContent =

      "⚡ " +
      selectedBoot1.name +
      " vs " +
      selectedBoot2.name;

  }
);


/* =====================================================
   UPDATE RESULT
===================================================== */

function updateResult(
  boot,
  number
) {


  document
    .getElementById(
      "resultBoot" +
      number
    )
    .textContent =
    boot.name;


  document
    .getElementById(
      "speed" +
      number
    )
    .textContent =
    boot.speed;


  document
    .getElementById(
      "control" +
      number
    )
    .textContent =
    boot.control;


  document
    .getElementById(
      "comfort" +
      number
    )
    .textContent =
    boot.comfort;


  document
    .getElementById(
      "weight" +
      number
    )
    .textContent =
    boot.weight;


  document
    .getElementById(
      "price" +
      number
    )
    .textContent =
    boot.price;


  document
    .getElementById(
      "surface" +
      number
    )
    .textContent =
    boot.surface;


  document
    .getElementById(
      "technology" +
      number
    )
    .textContent =
    boot.technology;


  const image =
    document.getElementById(
      "resultImage" +
      number
    );


  const card =
    image.parentElement;


  const oldLink =
    card.querySelector(
      ".product-link"
    );


  if (
    oldLink
  ) {

    oldLink.remove();

  }


  if (
    boot.image
  ) {

    image.src =
      boot.image;


    image.alt =
      boot.name;


    image.style.display =
      "block";

  }

  else {

    image.style.display =
      "none";


    if (
      boot.productPage
    ) {

      const link =
        document.createElement(
          "a"
        );


      link.className =
        "product-link";


      link.href =
        boot.productPage;


      link.target =
        "_blank";


      link.rel =
        "noopener noreferrer";


      link.textContent =
        "View this boot on Nike →";


      card.insertBefore(
        link,
        image.nextSibling
      );

    }

  }

}


/* =====================================================
   CLOSE DROPDOWNS
===================================================== */

document.addEventListener(
  "click",
  function(event) {

    if (
      !event.target.closest(
        ".boot-selector"
      )
    ) {

      document
        .getElementById(
          "suggestions1"
        )
        .classList
        .remove("show");


      document
        .getElementById(
          "suggestions2"
        )
        .classList
        .remove("show");

    }

  }
);

</script>
