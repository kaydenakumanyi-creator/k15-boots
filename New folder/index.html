<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Boot Comparison</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 40px 20px;
  font-family: Arial, Helvetica, sans-serif;
  background: transparent;
  color: #222;
}

.comparison-container {
  max-width: 1100px;
  margin: auto;
}

/* SEARCH AREA */
.boot-selection {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 25px;
}

.boot-selector {
  position: relative;
}

.boot-selector h3 {
  margin: 0 0 10px;
  font-size: 16px;
  font-weight: 600;
  color: #333;
}

.search-wrapper {
  position: relative;
}

.boot-search {
  width: 100%;
  padding: 15px 17px;
  border: 1px solid #ddd;
  border-radius: 13px;
  background: #f7f7f7;
  color: #222;
  font-size: 15px;
  outline: none;
  transition: border .2s ease, box-shadow .2s ease, background .2s ease;
}

.boot-search:focus {
  background: white;
  border-color: #999;
  box-shadow: 0 0 0 3px rgba(0,0,0,.05);
}

.suggestions {
  position: absolute;
  top: calc(100% + 7px);
  left: 0;
  right: 0;
  background: white;
  border-radius: 14px;
  border: 1px solid #e5e5e5;
  box-shadow: 0 12px 35px rgba(0,0,0,.14);
  overflow: hidden;
  z-index: 100;
  display: none;
  max-height: 350px;
  overflow-y: auto;
}

.suggestions.show {
  display: block;
}

.suggestion {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 14px;
  cursor: pointer;
  transition: background .15s ease;
}

.suggestion:hover {
  background: #f3f3f3;
}

.suggestion img,
.suggestion-placeholder {
  width: 65px;
  height: 50px;
  object-fit: contain;
  border-radius: 8px;
  background: #f7f7f7;
  flex-shrink: 0;
}

.suggestion-placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: #999;
  text-align: center;
}

.suggestion-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.suggestion-name {
  font-size: 14px;
  font-weight: 600;
}

.suggestion-brand {
  font-size: 12px;
  color: #888;
}

/* SELECTED BOOT */
.selected-boot {
  display: none;
  margin-top: 10px;
  padding: 10px;
  border-radius: 13px;
  background: #f5f5f5;
  align-items: center;
  gap: 12px;
}

.selected-boot.show {
  display: flex;
}

.selected-boot img,
.selected-placeholder {
  width: 70px;
  height: 55px;
  object-fit: contain;
  background: white;
  border-radius: 8px;
  flex-shrink: 0;
}

.selected-placeholder {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: #999;
  text-align: center;
}

.selected-info {
  flex: 1;
}

.selected-name {
  font-weight: 600;
  font-size: 14px;
}

.selected-brand {
  color: #888;
  font-size: 12px;
  margin-top: 4px;
}

.remove-boot {
  border: none;
  background: transparent;
  cursor: pointer;
  font-size: 18px;
  color: #999;
}

.remove-boot:hover {
  color: #333;
}

/* COMPARE BUTTON */
.compare-container {
  width: 100%;
  display: flex;
  justify-content: center;
  margin: 20px 0 35px;
}

.compare-button {
  position: relative;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,.15);
  outline: none;
  cursor: pointer;
  color: white;
  background: linear-gradient(145deg,#3b3f43,#17191b);
  padding: 15px 36px;
  font-size: 16px;
  font-weight: 600;
  border-radius: 13px;
  box-shadow: 0 6px 20px rgba(0,0,0,.25), 0 0 18px rgba(255,255,255,.08);
  transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
}

.compare-button::before {
  content: "";
  position: absolute;
  width: 150px;
  height: 150px;
  left: var(--mouse-x, 50%);
  top: var(--mouse-y, 50%);
  transform: translate(-50%,-50%);
  background: radial-gradient(circle,
    rgba(255,255,255,.45),
    rgba(255,255,255,.15) 30%,
    transparent 70%);
  opacity: 0;
  pointer-events: none;
}

.compare-button:hover::before {
  opacity: 1;
}

.compare-button:hover {
  transform: translateY(-2px);
  border-color: rgba(255,255,255,.45);
  box-shadow:
    0 8px 25px rgba(0,0,0,.3),
    0 0 8px rgba(255,255,255,.25),
    0 0 22px rgba(255,255,255,.25),
    0 0 45px rgba(255,255,255,.12);
}

.compare-button.neon {
  animation: neonPulse .7s ease-out;
}

@keyframes neonPulse {
  0% { box-shadow: 0 0 5px rgba(255,255,255,.2); }
  40% {
    box-shadow:
      0 0 8px rgba(255,255,255,.7),
      0 0 20px rgba(255,255,255,.6),
      0 0 40px rgba(255,255,255,.4);
  }
  100% { box-shadow: 0 0 0 rgba(255,255,255,0); }
}

/* RESULTS */
.comparison-result {
  display: none;
  margin-top: 20px;
  animation: fadeIn .4s ease;
}

.comparison-result.show {
  display: block;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.boots {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 20px;
}

.boot-card {
  background: white;
  border: 1px solid #e5e5e5;
  border-radius: 18px;
  padding: 25px;
  box-shadow: 0 5px 20px rgba(0,0,0,.07);
}

.boot-card h2 {
  margin-top: 0;
  font-size: 22px;
  color: #333;
}

.result-image {
  width: 100%;
  height: 180px;
  object-fit: contain;
  margin-bottom: 10px;
}

.stat {
  display: flex;
  justify-content: space-between;
  padding: 13px 0;
  border-bottom: 1px solid #eee;
  font-size: 15px;
}

.stat:last-child {
  border-bottom: none;
}

.stat-name {
  color: #777;
}

.stat-value {
  font-weight: 600;
  color: #333;
  text-align: right;
  max-width: 60%;
}

.winner {
  margin-top: 20px;
  padding: 15px;
  background: #f1f1f1;
  border-radius: 12px;
  text-align: center;
  font-weight: 600;
}

/* MOBILE */
@media (max-width: 700px) {
  .boot-selection,
  .boots {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<div class="comparison-container">

  <!-- FOUR BOOT SELECTORS -->
  <div class="boot-selection">

    <div class="boot-selector">
      <h3>Boot 1</h3>
      <div class="search-wrapper">
        <input class="boot-search" type="text" id="search1"
          placeholder="Search for a boot..." autocomplete="off">
        <div class="suggestions" id="suggestions1"></div>
      </div>
      <div class="selected-boot" id="selected1"></div>
    </div>

    <div class="boot-selector">
      <h3>Boot 2</h3>
      <div class="search-wrapper">
        <input class="boot-search" type="text" id="search2"
          placeholder="Search for a boot..." autocomplete="off">
        <div class="suggestions" id="suggestions2"></div>
      </div>
      <div class="selected-boot" id="selected2"></div>
    </div>

    <div class="boot-selector">
      <h3>Boot 3</h3>
      <div class="search-wrapper">
        <input class="boot-search" type="text" id="search3"
          placeholder="Search for a boot..." autocomplete="off">
        <div class="suggestions" id="suggestions3"></div>
      </div>
      <div class="selected-boot" id="selected3"></div>
    </div>

    <div class="boot-selector">
      <h3>Boot 4</h3>
      <div class="search-wrapper">
        <input class="boot-search" type="text" id="search4"
          placeholder="Search for a boot..." autocomplete="off">
        <div class="suggestions" id="suggestions4"></div>
      </div>
      <div class="selected-boot" id="selected4"></div>
    </div>

  </div>

  <div class="compare-container">
    <button class="compare-button" id="compareButton">
      Compare Boots
    </button>
  </div>

  <!-- RESULTS -->
  <div class="comparison-result" id="comparisonResult">
    <div class="boots" id="resultsGrid"></div>

    <div class="winner" id="winner">
      ⚡ Select boots above to compare them
    </div>
  </div>

</div>

<script>
/* =====================================================
   FOOTBALL BOOT DATABASE
===================================================== */

const boots = [
  {
    name: "Nike Mercurial Superfly 11 Elite FG",
    brand: "Nike Mercurial",
    image: "https://static.nike.com/a/images/t_web_pdp_535_v2/f_auto,u_9ddf04c7-2a9a-4d76-add1-d15af8f0263d,c_scale,fl_relative,w_1.0,h_1.0,fl_layer_apply/29dc7821-c782-4603-94d0-09334c0870ea/ZM+SUPERFLY+11+ELITE+FG.png",
    productPage: "https://www.nike.com/gb/",
    speed: "10/10",
    control: "8.5/10",
    comfort: "8.5/10",
    weight: "170g",
    price: "£254.99–£264.99",
    surface: "Firm Ground (FG)",
    technology: "Forefoot Air Zoom + ZoomX foam + FlyWeave Ultra"
  },

  {
    name: "Nike Mercurial Vapor 16 Elite FG",
    brand: "Nike Mercurial",
    image: "https://static.nike.com/a/images/t_web_pw_592_v2/f_auto/88c36b8b-d410-4974-807b-86277e4181b4/ZM+VAPOR+16+ELITE+FG.png",
    productPage: "https://www.nike.com/gb/",
    speed: "9.5/10",
    control: "9/10",
    comfort: "8/10",
    weight: "178g",
    price: "£234.99–£244.99",
    surface: "Firm Ground (FG)",
    technology: "3/4-length Air Zoom + Vaporposite+"
  },

  {
    name: "Nike Phantom Elite",
    brand: "Nike Phantom",
    image: "",
    productPage: "https://www.nike.com/gb/",
    speed: "8.5/10",
    control: "10/10",
    comfort: "9/10",
    weight: "Approx. 200g",
    price: "Elite price varies",
    surface: "Firm Ground",
    technology: "Gripknit + Cyclone 360"
  },

  {
    name: "Nike Tiempo Elite",
    brand: "Nike Tiempo",
    image: "",
    productPage: "https://www.nike.com/gb/",
    speed: "8/10",
    control: "9.5/10",
    comfort: "10/10",
    weight: "Approx. 200g",
    price: "Elite price varies",
    surface: "Firm Ground",
    technology: "FlyTouch Plus + flexible plate"
  },

  {
    name: "adidas X Elite FG",
    brand: "adidas X",
    image: "",
    productPage: "https://www.adidas.co.uk/",
    speed: "9.5/10",
    control: "8.5/10",
    comfort: "8/10",
    weight: "Lightweight",
    price: "Elite price varies",
    surface: "Firm Ground",
    technology: "Speedskin + lightweight Speedframe"
  },

  {
    name: "PUMA FUTURE Ultimate FG",
    brand: "PUMA FUTURE",
    image: "",
    productPage: "https://uk.puma.com/",
    speed: "8.5/10",
    control: "9.5/10",
    comfort: "9.5/10",
    weight: "Lightweight",
    price: "£220",
    surface: "Firm Ground",
    technology: "FUZIONPODS + 3D grip zones + FLEXGILITY"
  }
];

/* =====================================================
   FOUR SELECTIONS
===================================================== */

const selectedBoots = [null, null, null, null];

function showSuggestions(searchInput, suggestionsBox, selectionNumber) {
  const search = searchInput.value.toLowerCase().trim();
  suggestionsBox.innerHTML = "";

  const matches = boots.filter(boot =>
    boot.name.toLowerCase().includes(search) ||
    boot.brand.toLowerCase().includes(search)
  );

  if (matches.length === 0) {
    suggestionsBox.innerHTML =
      '<div style="padding:18px;text-align:center;color:#888;font-size:14px;">No boots found</div>';
    suggestionsBox.classList.add("show");
    return;
  }

  matches.forEach(boot => {
    const item = document.createElement("div");
    item.className = "suggestion";

    const imageHTML = boot.image
      ? `<img src="${boot.image}" alt="${boot.name}">`
      : `<div class="suggestion-placeholder">Image<br>coming soon</div>`;

    item.innerHTML = `
      ${imageHTML}
      <div class="suggestion-info">
        <div class="suggestion-name">${boot.name}</div>
        <div class="suggestion-brand">${boot.brand}</div>
      </div>
    `;

    item.addEventListener("click", () => {
      selectBoot(boot, selectionNumber);
    });

    suggestionsBox.appendChild(item);
  });

  suggestionsBox.classList.add("show");
}

function selectBoot(boot, selectionNumber) {
  const index = selectionNumber - 1;
  selectedBoots[index] = boot;

  document.getElementById("search" + selectionNumber).value = "";
  document.getElementById("suggestions" + selectionNumber)
    .classList.remove("show");

  showSelectedBoot(boot, selectionNumber);
}

function showSelectedBoot(boot, selectionNumber) {
  const element = document.getElementById("selected" + selectionNumber);

  const imageHTML = boot.image
    ? `<img src="${boot.image}" alt="${boot.name}">`
    : `<div class="selected-placeholder">Image<br>coming soon</div>`;

  element.innerHTML = `
    ${imageHTML}
    <div class="selected-info">
      <div class="selected-name">${boot.name}</div>
      <div class="selected-brand">${boot.brand}</div>
    </div>
    <button class="remove-boot" aria-label="Remove boot">×</button>
  `;

  element.querySelector(".remove-boot").addEventListener("click", () => {
    removeBoot(selectionNumber);
  });

  element.classList.add("show");
}

function removeBoot(selectionNumber) {
  const index = selectionNumber - 1;
  selectedBoots[index] = null;

  const element = document.getElementById("selected" + selectionNumber);
  element.innerHTML = "";
  element.classList.remove("show");
}

/* =====================================================
   SEARCH EVENTS FOR ALL FOUR BOXES
===================================================== */

for (let i = 1; i <= 4; i++) {
  const input = document.getElementById("search" + i);
  const suggestions = document.getElementById("suggestions" + i);

  input.addEventListener("input", function() {
    showSuggestions(this, suggestions, i);
  });

  input.addEventListener("focus", function() {
    showSuggestions(this, suggestions, i);
  });
}

/* =====================================================
   MOUSE GLOW
===================================================== */

const compareButton = document.getElementById("compareButton");

compareButton.addEventListener("mousemove", function(event) {
  const rect = compareButton.getBoundingClientRect();

  compareButton.style.setProperty("--mouse-x",
    (event.clientX - rect.left) + "px");

  compareButton.style.setProperty("--mouse-y",
    (event.clientY - rect.top) + "px");
});

/* =====================================================
   CREATE RESULT CARDS
===================================================== */

function createResultCard(boot, number) {
  return `
    <div class="boot-card">
      ${
        boot.image
        ? `<img class="result-image" src="${boot.image}" alt="${boot.name}">`
        : `<div class="result-image" style="display:flex;align-items:center;justify-content:center;color:#999;">Image coming soon</div>`
      }

      <h2>${boot.name}</h2>

      <div class="stat">
        <span class="stat-name">Speed</span>
        <span class="stat-value">${boot.speed}</span>
      </div>

      <div class="stat">
        <span class="stat-name">Control</span>
        <span class="stat-value">${boot.control}</span>
      </div>

      <div class="stat">
        <span class="stat-name">Comfort</span>
        <span class="stat-value">${boot.comfort}</span>
      </div>

      <div class="stat">
        <span class="stat-name">Weight</span>
        <span class="stat-value">${boot.weight}</span>
      </div>

      <div class="stat">
        <span class="stat-name">Price</span>
        <span class="stat-value">${boot.price}</span>
      </div>

      <div class="stat">
        <span class="stat-name">Surface</span>
        <span class="stat-value">${boot.surface}</span>
      </div>

      <div class="stat">
        <span class="stat-name">Technology</span>
        <span class="stat-value">${boot.technology}</span>
      </div>
    </div>
  `;
}

/* =====================================================
   COMPARE
===================================================== */

compareButton.addEventListener("click", function() {
  compareButton.classList.remove("neon");
  void compareButton.offsetWidth;
  compareButton.classList.add("neon");

  const chosen = selectedBoots.filter(Boolean);

  if (chosen.length < 2) {
    alert("Please select at least two boots first.");
    return;
  }

  document.getElementById("resultsGrid").innerHTML =
    chosen.map((boot, index) => createResultCard(boot, index + 1)).join("");

  document.getElementById("comparisonResult").classList.add("show");

  document.getElementById("winner").textContent =
    "⚡ Comparing " + chosen.map(boot => boot.name).join(" vs ");
});

/* =====================================================
   CLOSE DROPDOWNS
===================================================== */

document.addEventListener("click", function(event) {
  if (!event.target.closest(".boot-selector")) {
    for (let i = 1; i <= 4; i++) {
      document.getElementById("suggestions" + i)
        .classList.remove("show");
    }
  }
});
</script>

</body>
</html>
