<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football Boot Comparison</title>

<style>

/* =====================================================
   THEME
===================================================== */

:root {
  color-scheme: light dark;

  --page-bg: #f2f3f5;
  --surface: rgba(255,255,255,0.82);
  --surface-solid: #ffffff;
  --input-bg: rgba(248,248,249,0.95);

  --text: #202124;
  --heading: #151515;
  --muted: #777b82;

  --border: rgba(0,0,0,0.10);
  --soft-border: rgba(0,0,0,0.07);
  --shadow: rgba(0,0,0,0.10);

  --button-start: #eeeeee;
  --button-end: #cfd2d5;
  --button-text: #161616;

  --texture-dot: rgba(0,0,0,0.035);
}

@media (prefers-color-scheme: dark) {

  :root {

    --page-bg: #191919;
    --surface: rgba(31,31,33,0.86);
    --surface-solid: #222224;
    --input-bg: rgba(37,37,39,0.96);

    --text: #eeeeee;
    --heading: #ffffff;
    --muted: #a7a7ad;

    --border: rgba(255,255,255,0.12);
    --soft-border: rgba(255,255,255,0.08);
    --shadow: rgba(0,0,0,0.35);

    --button-start: #f2f2f2;
    --button-end: #bfc2c5;
    --button-text: #111111;

    --texture-dot: rgba(255,255,255,0.035);
  }
}


/* =====================================================
   MANUAL LIGHT THEME
===================================================== */

html[data-theme="light"] {

  color-scheme: light;

  --page-bg: #f2f3f5;
  --surface: rgba(255,255,255,0.82);
  --surface-solid: #ffffff;
  --input-bg: rgba(248,248,249,0.95);

  --text: #202124;
  --heading: #151515;
  --muted: #777b82;

  --border: rgba(0,0,0,0.10);
  --soft-border: rgba(0,0,0,0.07);
  --shadow: rgba(0,0,0,0.10);

  --button-start: #eeeeee;
  --button-end: #cfd2d5;
  --button-text: #161616;

  --texture-dot: rgba(0,0,0,0.035);
}


/* =====================================================
   MANUAL DARK THEME
===================================================== */

html[data-theme="dark"] {

  color-scheme: dark;

  --page-bg: #191919;
  --surface: rgba(31,31,33,0.86);
  --surface-solid: #222224;
  --input-bg: rgba(37,37,39,0.96);

  --text: #eeeeee;
  --heading: #ffffff;
  --muted: #a7a7ad;

  --border: rgba(255,255,255,0.12);
  --soft-border: rgba(255,255,255,0.08);
  --shadow: rgba(0,0,0,0.35);

  --button-start: #f2f2f2;
  --button-end: #bfc2c5;
  --button-text: #111111;

  --texture-dot: rgba(255,255,255,0.035);
}


/* =====================================================
   GENERAL
===================================================== */

* {
  box-sizing: border-box;
}

html {
  background: transparent;
}

body {

  margin: 0;
  padding: 32px 20px 50px;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color: var(--text);

  background:

    radial-gradient(
      circle at 15% 10%,
      rgba(255,255,255,0.08),
      transparent 28%
    ),

    radial-gradient(
      circle at 85% 85%,
      rgba(255,255,255,0.05),
      transparent 30%
    ),

    radial-gradient(
      var(--texture-dot) 1px,
      transparent 1px
    );

  background-size:
    auto,
    auto,
    18px 18px;

  transition:
    color .3s ease;
}

body::before {

  content: "";

  position: fixed;

  inset: 0;

  pointer-events: none;

  background:
    linear-gradient(
      135deg,
      transparent 0%,
      rgba(255,255,255,0.025) 45%,
      transparent 70%
    );

  z-index: -1;
}


.comparison-container {

  max-width: 1100px;

  margin: auto;
}


/* =====================================================
   THEME BUTTON
===================================================== */

.top-controls {

  display: flex;

  justify-content: flex-end;

  margin-bottom: 14px;
}

.theme-button {

  border: 1px solid var(--border);

  background: var(--surface);

  color: var(--text);

  border-radius: 999px;

  padding: 8px 13px;

  font-size: 12px;

  cursor: pointer;

  backdrop-filter: blur(12px);

  transition:
    transform .2s ease,
    background .2s ease,
    border .2s ease;
}

.theme-button:hover {

  transform: translateY(-1px);

  border-color: rgba(255,255,255,.3);
}


/* =====================================================
   BOOT SELECTION
===================================================== */

.boot-selection {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 16px;
}

.boot-selector {

  position: relative;
}

.boot-label {

  display: block;

  margin-bottom: 10px;

  font-size: 16px;

  font-weight: 600;

  color: var(--heading);
}


/* =====================================================
   SEARCH
===================================================== */

.search-wrapper {

  position: relative;
}

.boot-search {

  width: 100%;

  padding: 15px 17px;

  border: 1px solid var(--border);

  border-radius: 13px;

  background: var(--input-bg);

  color: var(--text);

  font-size: 15px;

  outline: none;

  transition:
    border .2s ease,
    box-shadow .2s ease,
    background .3s ease,
    color .3s ease;
}

.boot-search::placeholder {

  color: var(--muted);
}

.boot-search:focus {

  border-color:
    rgba(255,255,255,.45);

  box-shadow:

    0 0 0 3px
      rgba(255,255,255,.06),

    0 8px 25px
      var(--shadow);
}


/* =====================================================
   SUGGESTIONS
===================================================== */

.suggestions {

  position: absolute;

  top: calc(100% + 7px);

  left: 0;

  right: 0;

  background:
    var(--surface-solid);

  border-radius: 14px;

  border: 1px solid var(--border);

  box-shadow:
    0 15px 40px var(--shadow);

  overflow: hidden;

  z-index: 100;

  display: none;
}

.suggestions.show {

  display: block;
}

.suggestion {

  display: flex;

  align-items: center;

  gap: 12px;

  padding: 10px;

  cursor: pointer;

  transition:
    background .2s ease;
}

.suggestion:hover {

  background:
    rgba(128,128,128,.10);
}

.suggestion img,
.suggestion-placeholder {

  width: 50px;

  height: 50px;

  object-fit: contain;

  border-radius: 8px;

  background:
    var(--input-bg);

  flex-shrink: 0;
}

.suggestion-placeholder {

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 10px;

  color: var(--muted);

  text-align: center;
}

.suggestion-info {

  display: flex;

  flex-direction: column;

  gap: 4px;

  min-width: 0;
}

.suggestion-name {

  font-size: 14px;

  font-weight: 600;

  color: var(--text);
}

.suggestion-brand {

  font-size: 12px;

  color: var(--muted);
}


/* =====================================================
   SELECTED BOOT
===================================================== */

.selected-boot {

  display: none;

  margin-top: 10px;

  padding: 10px;

  border-radius: 13px;

  background: var(--surface);

  border: 1px solid var(--soft-border);

  align-items: center;

  gap: 12px;

  backdrop-filter: blur(10px);
}

.selected-boot.show {

  display: flex;
}

.selected-boot img,
.selected-placeholder {

  width: 70px;

  height: 55px;

  object-fit: contain;

  background:
    var(--surface-solid);

  border-radius: 8px;

  flex-shrink: 0;
}

.selected-placeholder {

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 10px;

  color: var(--muted);

  text-align: center;
}

.selected-info {

  flex: 1;

  min-width: 0;
}

.selected-name {

  font-weight: 600;

  font-size: 14px;

  color: var(--text);
}

.selected-brand {

  color: var(--muted);

  font-size: 12px;

  margin-top: 4px;
}

.boot-page-link {

  display: inline-block;

  margin-top: 6px;

  color: var(--text);

  font-size: 11px;

  font-weight: 600;

  text-decoration: none;

  opacity: .7;

  transition:
    opacity .2s ease;
}

.boot-page-link:hover {

  opacity: 1;

  text-decoration: underline;
}

.remove-boot {

  border: none;

  background: transparent;

  cursor: pointer;

  font-size: 18px;

  color: var(--muted);

  padding: 5px;
}

.remove-boot:hover {

  color: var(--text);
}


/* =====================================================
   COMPARE BUTTON
===================================================== */

.compare-container {

  width: 100%;

  display: flex;

  justify-content: center;

  margin: 22px 0 35px;
}

.compare-button {

  position: relative;

  overflow: hidden;

  border:
    1px solid rgba(255,255,255,.25);

  outline: none;

  cursor: pointer;

  color: var(--button-text);

  background:
    linear-gradient(
      145deg,
      var(--button-start),
      var(--button-end)
    );

  padding: 15px 36px;

  font-size: 16px;

  font-weight: 700;

  border-radius: 13px;

  box-shadow:

    0 7px 22px
      var(--shadow),

    0 0 18px
      rgba(255,255,255,.10);

  transition:

    transform .25s ease,

    box-shadow .25s ease,

    border-color .25s ease;
}


/* Mouse-following light */

.compare-button::before {

  content: "";

  position: absolute;

  width: 180px;

  height: 180px;

  left:
    var(--mouse-x, 50%);

  top:
    var(--mouse-y, 50%);

  transform:
    translate(-50%,-50%);

  background:
    radial-gradient(
      circle,

      rgba(255,255,255,.75),

      rgba(255,255,255,.20) 32%,

      transparent 70%
    );

  opacity: 0;

  pointer-events: none;

  transition:
    opacity .15s ease;
}

.compare-button:hover::before {

  opacity: 1;
}

.compare-button:hover {

  transform:
    translateY(-2px);

  border-color:
    rgba(255,255,255,.65);

  box-shadow:

    0 9px 27px
      var(--shadow),

    0 0 10px
      rgba(255,255,255,.30),

    0 0 25px
      rgba(255,255,255,.20),

    0 0 45px
      rgba(255,255,255,.10);
}


/* =====================================================
   RIPPLE
===================================================== */

.ripple {

  position: absolute;

  border-radius: 50%;

  pointer-events: none;

  width: 10px;

  height: 10px;

  left:
    var(--ripple-x);

  top:
    var(--ripple-y);

  transform:
    translate(-50%, -50%)
    scale(0);

  background:
    rgba(255,255,255,.75);

  box-shadow:

    0 0 10px
      rgba(255,255,255,.8),

    0 0 25px
      rgba(255,255,255,.55),

    0 0 55px
      rgba(255,255,255,.30);

  animation:
    rippleWave .8s ease-out forwards;
}

@keyframes rippleWave {

  0% {

    width: 10px;

    height: 10px;

    opacity: .95;

    transform:
      translate(-50%, -50%)
      scale(0);
  }

  55% {

    opacity: .45;
  }

  100% {

    width: 480px;

    height: 480px;

    opacity: 0;

    transform:
      translate(-50%, -50%)
      scale(1);
  }
}


/* =====================================================
   NEON EFFECT
===================================================== */

.compare-button.neon {

  animation:
    neonPulse .7s ease-out;
}

@keyframes neonPulse {

  0% {

    box-shadow:
      0 0 5px
      rgba(255,255,255,.2);
  }

  40% {

    box-shadow:

      0 0 8px
        rgba(255,255,255,.75),

      0 0 20px
        rgba(255,255,255,.65),

      0 0 40px
        rgba(255,255,255,.40);
  }

  100% {

    box-shadow:
      0 0 0
      rgba(255,255,255,0);
  }
}


/* =====================================================
   RESULTS
===================================================== */

.comparison-result {

  display: none;

  margin-top: 20px;

  animation:
    fadeIn .4s ease;
}

.comparison-result.show {

  display: block;
}

@keyframes fadeIn {

  from {

    opacity: 0;

    transform:
      translateY(10px);
  }

  to {

    opacity: 1;

    transform:
      translateY(0);
  }
}

.boots {

  display: grid;

  grid-template-columns:
    repeat(2, 1fr);

  gap: 18px;
}

.boot-card {

  background:
    var(--surface);

  border:
    1px solid var(--border);

  border-radius: 18px;

  padding: 25px;

  box-shadow:
    0 7px 25px
    var(--shadow);

  backdrop-filter:
    blur(12px);
}

.boot-card h2 {

  margin-top: 0;

  font-size: 22px;

  color: var(--heading);
}

.result-image {

  width: 100%;

  height: 180px;

  object-fit: contain;

  background:
    var(--surface-solid);

  border-radius: 12px;

  margin-bottom: 15px;
}

.stat {

  display: flex;

  justify-content: space-between;

  padding: 13px 0;

  border-bottom:
    1px solid
    var(--soft-border);

  font-size: 15px;
}

.stat-name {

  color: var(--muted);
}

.stat-value {

  font-weight: 600;

  color: var(--text);

  text-align: right;

  max-width: 60%;
}

.winner {

  margin-top: 20px;

  padding: 15px;

  background:
    var(--surface);

  border:
    1px solid
    var(--soft-border);

  border-radius: 12px;

  text-align: center;

  font-weight: 600;

  color: var(--text);
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 700px) {

  .boot-selection,
  .boots {

    grid-template-columns:
      1fr;
  }

  body {

    padding:
      25px 14px 40px;
  }
}

</style>
</head>


<body>


<div class="comparison-container">


<!-- =====================================================
     THEME
===================================================== -->

<div class="top-controls">

  <button
    class="theme-button"
    id="themeButton"
    type="button"
  >
    Theme: Auto
  </button>

</div>


<!-- =====================================================
     BOOT SELECTORS
===================================================== -->

<div class="boot-selection">


<!-- BOOT 1 -->

<div class="boot-selector">

  <label
    class="boot-label"
    for="search1"

  </label>

  <div class="search-wrapper">

    <input
      id="search1"

<!-- BOOT 2 -->

<div class="boot-selector">

  </label>

  <div class="search-wrapper">

    <input
      id="search2"
      class="boot-search"
      type="text"
      placeholder="Search for a boot..."
      autocomplete="off"
    >

    <div
      id="suggestions2"
      class="suggestions"
    ></div>

  </div>

  <div
    id="selected2"
    class="selected-boot"
  ></div>

</div>


<!-- BOOT 3 -->

<div class="boot-selector">

  <label
    class="boot-label"
    for="search3"
  >
    Boot 3
  </label>

  <div class="search-wrapper">

    <input
      id="search3"
      class="boot-search"
      type="text"
      placeholder="Search for a boot..."

    >

    <div
      id="suggestions3"
      class="suggestions"
    ></div>

  </div>

  <div
    id="selected3"
    class="selected-boot"
  ></div>

</div>


<!-- BOOT 4 -->

<div class="boot-selector">

  <label
    class="boot-label"
    for="search4"
  >
    Boot 4
  </label>

  <div class="search-wrapper">

    <input
      id="search4"
      class="boot-search"
      type="text"
      placeholder="Search for a boot..."
      autocomplete="off"
    >

    <div
      id="suggestions4"
      class="suggestions"
    ></div>

  </div>

  <div
    id="selected4"
    class="selected-boot"
  ></div>

</div>


</div>


<!-- =====================================================
     COMPARE BUTTON
===================================================== -->

<div class="compare-container">

  <button
    class="compare-button"
    id="compareButton"

  </button>

  </div>

<script>


/* =====================================================
   FOOTBALL BOOT DATABASE
===================================================== */

const boots = [


/* -----------------------------------------------------
   NIKE MERCURIAL SUPERFLY 11
----------------------------------------------------- */

{
  name:
    "Nike Mercurial Superfly 11 Elite FG",

  brand:
    "Nike Mercurial",

  image:
    "https://static.nike.com/a/images/t_web_pdp_535_v2/f_auto,u_9ddf04c7-2a9a-4d76-add1-d15af8f0263d,c_scale,fl_relative,w_1.0,h_1.0,fl_layer_apply/29dc7821-c782-4603-94d0-09334c0870ea/ZM+SUPERFLY+11+ELITE+FG.png",

  productPage:
    "https://www.nike.com/gb/t/mercurial-superfly-11-elite-firm-ground-low-top-football-boots-kSXagTAt/IF8507-101",

  speed:
    "10/10",

  control:
    "8.5/10",

  comfort:
    "8.5/10",

  touch:
    "9/10",

  weight:
    "Very Lightweight",

  surface:
    "Firm Ground",

  technology:
    "Air Zoom + Gripknit + Flex Frame"
},


/* -----------------------------------------------------
   NIKE PHANTOM
----------------------------------------------------- */

{
  name:
    "Nike Phantom 6 High Elite FG",

  brand:
    "Nike Phantom",

  image:
    "",

  productPage:
    "https://www.nike.com/gb/w/phantom-football-shoes-1gdj0z4bqsgz",

  speed:
    "8/10",

  control:
    "10/10",

  comfort:
    "9/10",

  touch:
    "10/10",

  weight:
    "Lightweight",

  surface:
    "Firm Ground",

  technology:
    "Gripknit + Cyclone 360"
},


/* -----------------------------------------------------
   ADIDAS X
----------------------------------------------------- */

{
  name:
    "adidas X Crazyfast Elite FG",

  brand:
    "adidas X",

  image:
    "",

  productPage:
    "https://www.adidas.co.uk/football-boots",

  speed:
    "10/10",

  control:
    "8/10",

  comfort:
    "8/10",

  touch:
    "8.5/10",

  weight:
    "Very Lightweight",

  surface:
    "Firm Ground",

  technology:
    "Aeropacity Speedskin"
},


/* -----------------------------------------------------
   PUMA FUTURE
----------------------------------------------------- */

{
  name:
    "PUMA Future 8 Ultimate FG",

  brand:
    "PUMA Future",

  image:
    "",

  productPage:
    "https://uk.puma.com/uk/en/sports/football",

  speed:
    "8.5/10",

  control:
    "9.5/10",

  comfort:
    "9.5/10",

  touch:
    "9/10",

  weight:
    "Lightweight",

  surface:
    "Firm Ground",

  technology:
    "FUZIONFIT + 3D grip zones"
}


];


/* =====================================================
   SELECTED BOOTS
===================================================== */

const selectedBoots =
  [null, null, null, null];


/* =====================================================
   SHOW SEARCH SUGGESTIONS
===================================================== */

function showSuggestions(
  searchInput,
  suggestionsBox,
  selectionNumber
) {

  const search =
    searchInput.value
      .toLowerCase()
      .trim();

  suggestionsBox.innerHTML = "";


  if (!search) {

    suggestionsBox
      .classList
      .remove("show");

    return;
  }


  const matches =
    boots.filter(boot =>

      boot.name
        .toLowerCase()
        .includes(search)

      ||

      boot.brand
        .toLowerCase()
        .includes(search)

    );


  if (matches.length === 0) {

    suggestionsBox.innerHTML =

      `<div
        style="
          padding:18px;
          text-align:center;
          color:var(--muted);
          font-size:14px;
        "
      >
        No boots found
      </div>`;

    suggestionsBox
      .classList
      .add("show");

    return;
  }


  matches.forEach(boot => {

    const item =
      document.createElement("div");

    item.className =
      "suggestion";


    const imageHTML =
      boot.image

        ?

      `<img
        src="${boot.image}"
        alt="${boot.name}"
      >`

        :

      `<div
        class="suggestion-placeholder"
      >
        Image
      </div>`;


    item.innerHTML = `

      ${imageHTML}

      <div class="suggestion-info">

        <div class="suggestion-name">
          ${boot.name}
        </div>

        <div class="suggestion-brand">
          ${boot.brand}
        </div>

      </div>

    `;


    item.addEventListener(
      "click",
      () => {

        selectBoot(
          boot,
          selectionNumber
        );

      }
    );


    suggestionsBox.appendChild(item);

  });


  suggestionsBox
    .classList
    .add("show");
}


/* =====================================================
   SELECT BOOT
===================================================== */

function selectBoot(
  boot,
  selectionNumber
) {

  const index =
    selectionNumber - 1;


  selectedBoots[index] =
    boot;


  document.getElementById(
    "search" + selectionNumber
  ).value = "";


  document.getElementById(
    "suggestions" + selectionNumber
  )
  .classList
  .remove("show");


  showSelectedBoot(
    boot,
    selectionNumber
  );
}


/* =====================================================
   SHOW SELECTED BOOT
===================================================== */

function showSelectedBoot(
  boot,
  selectionNumber
) {

  const element =
    document.getElementById(
      "selected" + selectionNumber
    );


  const imageHTML =
    boot.image

      ?

    `<img
      src="${boot.image}"
      alt="${boot.name}"
    >`

      :

    `<div
      class="selected-placeholder"
    >
      Image<br>
      coming soon
    </div>`;


  element.innerHTML = `

    ${imageHTML}

    <div class="selected-info">

      <div class="selected-name">
        ${boot.name}
      </div>

      <div class="selected-brand">
        ${boot.brand}
      </div>

      <a
        class="boot-page-link"
        href="${boot.productPage}"
        target="_blank"
        rel="noopener noreferrer"
      >
        View boot page →
      </a>

    </div>

    <button
      class="remove-boot"
      type="button"
      aria-label="Remove boot"
    >
      ×
    </button>

  `;


  element
    .querySelector(".remove-boot")
    .addEventListener(
      "click",
      () => {

        removeBoot(
          selectionNumber
        );

      }
    );


  element
    .classList
    .add("show");
}


/* =====================================================
   REMOVE BOOT
===================================================== */

function removeBoot(
  selectionNumber
) {

  const index =
    selectionNumber - 1;


  selectedBoots[index] =
    null;


  const element =
    document.getElementById(
      "selected" + selectionNumber
    );


  element.innerHTML = "";

  element
    .classList
    .remove("show");
}


/* =====================================================
   SEARCH EVENTS
===================================================== */

for (
  let i = 1;
  i <= 4;
  i++
) {

  const input =
    document.getElementById(
      "search" + i
    );


  const suggestions =
    document.getElementById(
      "suggestions" + i
    );


  input.addEventListener(
    "input",
    function() {

      showSuggestions(
        this,
        suggestions,
        i
      );

    }
  );


  input.addEventListener(
    "focus",
    function() {

      showSuggestions(
        this,
        suggestions,
        i
      );

    }
  );

}


/* =====================================================
   CLOSE DROPDOWNS
===================================================== */

document.addEventListener(
  "click",
  function(event) {

    if (
      !event.target
        .closest(".boot-selector")
    ) {

      for (
        let i = 1;
        i <= 4;
        i++
      ) {

        document
          .getElementById(
            "suggestions" + i
          )
          .classList
          .remove("show");

      }

    }

  }
);


/* =====================================================
   COMPARE BUTTON
===================================================== */

const compareButton =
  document.getElementById(
    "compareButton"
  );


/* =====================================================
   MOUSE FOLLOWING GLOW
===================================================== */

compareButton.addEventListener(
  "mousemove",
  function(event) {

    const rect =
      compareButton
        .getBoundingClientRect();


    compareButton.style.setProperty(
      "--mouse-x",
      (
        event.clientX -
        rect.left
      ) + "px"
    );


    compareButton.style.setProperty(
      "--mouse-y",
      (
        event.clientY -
        rect.top
      ) + "px"
    );

  }
);


/* =====================================================
   CLICK RIPPLE
===================================================== */

compareButton.addEventListener(
  "click",
  function(event) {

    const rect =
      compareButton
        .getBoundingClientRect();


    const ripple =
      document.createElement("span");


    ripple.className =
      "ripple";


    ripple.style.setProperty(
      "--ripple-x",
      (
        event.clientX -
        rect.left
      ) + "px"
    );


    ripple.style.setProperty(
      "--ripple-y",
      (
        event.clientY -
        rect.top
      ) + "px"
    );


    compareButton.appendChild(
      ripple
    );


    ripple.addEventListener(
      "animationend",
      () => {

        ripple.remove();

      }
    );


    compareButton
      .classList
      .remove("neon");


    void compareButton.offsetWidth;


    compareButton
      .classList
      .add("neon");

  }
);


/* =====================================================
   CREATE RESULT CARD
===================================================== */

function createResultCard(
  boot
) {

  const imageHTML =
    boot.image

      ?

    `<img
      class="result-image"
      src="${boot.image}"
      alt="${boot.name}"
    >`

      :

    `<div
      class="result-image"
      style="
        display:flex;
        align-items:center;
        justify-content:center;
        color:var(--muted);
      "
    >
      Image coming soon
    </div>`;


  return `

    <div class="boot-card">

      ${imageHTML}

      <h2>
        ${boot.name}
      </h2>


      <div class="stat">

        <span class="stat-name">
          Speed
        </span>

        <span class="stat-value">
          ${boot.speed}
        </span>

      </div>


      <div class="stat">

        <span class="stat-name">
          Control
        </span>

        <span class="stat-value">
          ${boot.control}
        </span>

      </div>


      <div class="stat">

        <span class="stat-name">
          Comfort
        </span>

        <span class="stat-value">
          ${boot.comfort}
        </span>

      </div>


      <div class="stat">

        <span class="stat-name">
          Touch
        </span>

        <span class="stat-value">
          ${boot.touch}
        </span>

      </div>


      <div class="stat">

        <span class="stat-name">
          Weight
        </span>

        <span class="stat-value">
          ${boot.weight}
        </span>

      </div>


      <div class="stat">

        <span class="stat-name">
          Surface
        </span>

        <span class="stat-value">
          ${boot.surface}
        </span>

      </div>


      <div class="stat">

        <span class="stat-name">
          Technology
        </span>

        <span class="stat-value">
          ${boot.technology}
        </span>

      </div>


      <a
        class="boot-page-link"
        href="${boot.productPage}"
        target="_blank"
        rel="noopener noreferrer"
      >
        View boot page →
      </a>

    </div>

  `;
}


/* =====================================================
   COMPARE
===================================================== */

compareButton.addEventListener(
  "click",
  function() {

    const chosen =
      selectedBoots.filter(
        Boolean
      );


    if (
      chosen.length < 2
    ) {

      alert(
        "Please select at least two boots first."
      );

      return;
    }


    document.getElementById(
      "resultsGrid"
    ).innerHTML =

      chosen
        .map(
          boot =>
            createResultCard(
              boot
            )
        )
        .join("");


    document.getElementById(
      "comparisonResult"
    )
    .classList
    .add("show");


    document.getElementById(
      "winner"
    ).textContent =

      "⚡ Comparing " +
      chosen
        .map(
          boot =>
            boot.name
        )
        .join(" vs ");

  }
);


/* =====================================================
   THEME SYSTEM
===================================================== */

const themeButton =
  document.getElementById(
    "themeButton"
  );


let themeMode =
  localStorage.getItem(
    "bootComparisonTheme"
  ) || "auto";


function applyTheme() {

  if (
    themeMode === "auto"
  ) {

    document.documentElement
      .removeAttribute(
        "data-theme"
      );


    themeButton.textContent =
      "Theme: Auto";

  }

  else {

    document.documentElement
      .setAttribute(
        "data-theme",
        themeMode
      );


    themeButton.textContent =

      themeMode === "dark"

        ?

      "Theme: Dark"

        :

      "Theme: Light";

  }

}


themeButton.addEventListener(
  "click",
  function() {

    if (
      themeMode === "auto"
    ) {

      themeMode = "light";

    }

    else if (
      themeMode === "light"
    ) {

      themeMode = "dark";

    }

    else {

      themeMode = "auto";

    }


    localStorage.setItem(
      "bootComparisonTheme",
      themeMode
    );


    applyTheme();

  }
);


applyTheme();


/* =====================================================
   FOLLOW SYSTEM THEME
===================================================== */

const systemTheme =
  window.matchMedia(
    "(prefers-color-scheme: dark)"
  );


systemTheme.addEventListener(
  "change",
  function() {

    if (
      themeMode === "auto"
    ) {

      applyTheme();

    }

  }
);

</script>


</body>
</html>
