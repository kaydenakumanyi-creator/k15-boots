<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K15 Boots - Compare & Choose</title>

<style>

* {
  box-sizing: border-box;
}

/* ================================
   DARK MODE DEFAULT
================================ */

:root {
  --background: #191919;
  --text: #f5f5f5;
  --secondary-text: #a0a0a0;
  --card: #222222;
  --input: #242424;
  --border: #383838;
  --hover: #303030;
  --soft: #292929;
  --button: #f2f2f2;
  --button-text: #191919;
  --shadow: rgba(0,0,0,0.35);
}


/* ================================
   AUTOMATIC LIGHT MODE
================================ */

@media (prefers-color-scheme: light) {

  :root {
    --background: #f5f5f5;
    --text: #202020;
    --secondary-text: #777777;
    --card: #ffffff;
    --input: #ffffff;
    --border: #dddddd;
    --hover: #eeeeee;
    --soft: #eeeeee;
    --button: #191919;
    --button-text: #ffffff;
    --shadow: rgba(0,0,0,0.12);
  }

}


/* ================================
   BODY
================================ */

html,
body {
  margin: 0;
  min-height: 100%;
}

body {

  padding: 40px 20px;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  background: var(--background);

  color: var(--text);

  transition:
    background 0.3s ease,
    color 0.3s ease;

}


/* ================================
   MAIN CONTAINER
================================ */

.comparison-container {

  max-width: 1000px;

  margin: auto;

}


/* ================================
   SEARCH AREA
================================ */

.boot-selection {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 20px;

  margin-bottom: 25px;

}


.boot-selector {

  position: relative;

}


.boot-selector h3 {

  margin:
    0 0 10px;

  font-size: 16px;

  font-weight: 600;

  color: var(--text);

}


/* ================================
   SEARCH BOX
================================ */

.search-wrapper {

  position: relative;

}


.boot-search {

  width: 100%;

  padding:
    15px 17px;

  border:
    1px solid var(--border);

  border-radius:
    13px;

  background:
    var(--input);

  color:
    var(--text);

  font-size:
    15px;

  outline: none;

  transition:
    border 0.2s ease,
    box-shadow 0.2s ease,
    background 0.3s ease,
    color 0.3s ease;

}


.boot-search::placeholder {

  color:
    var(--secondary-text);

}


.boot-search:focus {

  border-color:
    var(--text);

  box-shadow:
    0 0 0 3px
    rgba(127,127,127,0.15);

}


/* ================================
   SUGGESTIONS
================================ */

.suggestions {

  position: absolute;

  top:
    calc(100% + 7px);

  left: 0;

  right: 0;

  background:
    var(--card);

  border:
    1px solid var(--border);

  border-radius:
    14px;

  box-shadow:
    0 12px 35px var(--shadow);

  overflow: hidden;

  z-index: 100;

  display: none;

  max-height:
    350px;

  overflow-y: auto;

}


.suggestions.show {

  display: block;

}


.suggestion {

  display: flex;

  align-items: center;

  gap: 14px;

  padding:
    12px 14px;

  cursor: pointer;

  transition:
    background 0.15s ease;

}


.suggestion:hover {

  background:
    var(--hover);

}


.suggestion img {

  width: 65px;

  height: 50px;

  object-fit: contain;

  border-radius: 8px;

  background:
    var(--soft);

}


.suggestion-placeholder {

  width: 65px;

  height: 50px;

  border-radius: 8px;

  background:
    var(--soft);

  display: flex;

  align-items: center;

  justify-content: center;

  font-size: 10px;

  color:
    var(--secondary-text);

  text-align: center;

}


.suggestion-info {

  display: flex;

  flex-direction: column;

  gap: 4px;

}


.suggestion-name {

  font-size: 14px;

  font-weight: 600;

  color:
    var(--text);

}


.suggestion-brand {

  font-size: 12px;

  color:
    var(--secondary-text);

}


/* ================================
   SELECTED BOOT
================================ */

.selected-boot {

  display: none;

  margin-top: 10px;

  padding: 10px;

  border-radius: 13px;

  background:
    var(--soft);

  align-items: center;

  gap: 12px;

}


.selected-boot.show {

  display: flex;

}


.selected-boot img {

  width: 70px;

  height: 55px;

  object-fit: contain;

  background:
    var(--card);

  border-radius: 8px;

}


.selected-placeholder {

  width: 70px;

  height: 55px;

  display: flex;

  align-items: center;

  justify-content: center;

  background:
    var(--card);

  border-radius: 8px;

  font-size: 10px;

  color:
    var(--secondary-text);

  text-align: center;

}


.selected-info {

  flex: 1;

}


.selected-name {

  font-weight: 600;

  font-size: 14px;

  color:
    var(--text);

}


.selected-brand {

  color:
    var(--secondary-text);

  font-size: 12px;

  margin-top: 4px;

}


.remove-boot {

  border: none;

  background: transparent;

  cursor: pointer;

  font-size: 20px;

  color:
    var(--secondary-text);

}


.remove-boot:hover {

  color:
    var(--text);

}


/* ================================
   COMPARE BUTTON
================================ */

.compare-container {

  width: 100%;

  display: flex;

  justify-content: center;

  margin:
    20px 0 35px;

}


.compare-button {

  position: relative;

  overflow: hidden;

  border:
    1px solid var(--border);

  outline: none;

  cursor: pointer;

  color:
    var(--button-text);

  background:
    var(--button);

  padding:
    15px 36px;

  font-size: 16px;

  font-weight: 600;

  border-radius:
    13px;

  box-shadow:

    0 6px 20px
    var(--shadow),

    0 0 18px
    rgba(127,127,127,0.12);

  transition:

    transform 0.25s ease,

    box-shadow 0.25s ease,

    border-color 0.25s ease;

}


/* MOUSE GLOW */

.compare-button::before {

  content: "";

  position: absolute;

  width: 150px;

  height: 150px;

  left:
    var(--mouse-x, 50%);

  top:
    var(--mouse-y, 50%);

  transform:
    translate(-50%, -50%);

  background:

    radial-gradient(

      circle,

      rgba(127,127,127,0.45),

      rgba(127,127,127,0.15)
      30%,

      transparent
      70%

    );

  opacity: 0;

  pointer-events: none;

}


.compare-button:hover::before {

  opacity: 1;

}


.compare-button:hover {

  transform:
    translateY(-2px);

  border-color:
    var(--text);

  box-shadow:

    0 8px 25px
    var(--shadow),

    0 0 8px
    rgba(127,127,127,0.35),

    0 0 22px
    rgba(127,127,127,0.28),

    0 0 45px
    rgba(127,127,127,0.16);

}


/* ================================
   NEON EFFECT
================================ */

.compare-button.neon {

  animation:
    neonPulse
    0.7s
    ease-out;

}


@keyframes neonPulse {

  0% {

    box-shadow:
      0 0 5px
      rgba(127,127,127,0.2);

  }

  40% {

    box-shadow:

      0 0 8px
      rgba(127,127,127,0.8),

      0 0 20px
      rgba(127,127,127,0.65),

      0 0 40px
      rgba(127,127,127,0.45);

  }

  100% {

    box-shadow:
      0 0 0
      rgba(127,127,127,0);

  }

}


/* ================================
   RESULTS
================================ */

.comparison-result {

  display: none;

  margin-top: 20px;

  animation:
    fadeIn
    0.4s
    ease;

}


.comparison-result.show {

  display: block;

}


@keyframes fadeIn {

  from {

    opacity: 0;

    transform:
      translateY(10px);

  }

  to {

    opacity: 1;

    transform:
      translateY(0);

  }

}


/* ================================
   BOOT CARDS
================================ */

.boots {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 20px;

}


.boot-card {

  background:
    var(--card);

  border:
    1px solid var(--border);

  border-radius:
    18px;

  padding: 25px;

  box-shadow:
    0 5px 20px
    var(--shadow);

  transition:

    background 0.3s ease,

    border 0.3s ease;

}


.boot-card h2 {

  margin-top: 0;

  font-size: 22px;

  color:
    var(--text);

}


.result-image {

  width: 100%;

  height: 180px;

  object-fit: contain;

  margin-bottom: 10px;

}


.stat {

  display: flex;

  justify-content:
    space-between;

  padding:
    13px 0;

  border-bottom:
    1px solid var(--border);

  font-size: 15px;

}


.stat:last-child {

  border-bottom: none;

}


.stat-name {

  color:
    var(--secondary-text);

}


.stat-value {

  font-weight: 600;

  color:
    var(--text);

  text-align: right;

  max-width: 60%;

}


.winner {

  margin-top: 20px;

  padding: 15px;

  background:
    var(--soft);

  border-radius: 12px;

  text-align: center;

  font-weight: 600;

  color:
    var(--text);

}


/* NIKE LINK */

.nike-product-link {

  display: block;

  text-align: center;

  padding: 12px;

  margin-bottom: 15px;

  background:
    var(--soft);

  border-radius: 10px;

  color:
    var(--text);

  text-decoration: none;

}


.nike-product-link:hover {

  background:
    var(--hover);

}


/* ================================
   MOBILE
================================ */

@media (max-width: 700px) {

  .boot-selection,
  .boots {

    grid-template-columns:
      1fr;

  }

  body {

    padding:
      25px 14px;

  }

}

</style>

  },

/* =====================================================
   SELECTED BOOTS
===================================================== */

let selectedBoot1 = null;

let selectedBoot2 = null;


/* =====================================================
   SHOW SUGGESTIONS
===================================================== */

function showSuggestions(
  searchInput,
  suggestionsBox,
  selectionNumber
) {

  const search =
    searchInput.value
      .toLowerCase()
      .trim();


  suggestionsBox.innerHTML = "";


  const matches =
    boots.filter(
      boot =>

        boot.name
          .toLowerCase()
          .includes(search)

        ||

        boot.brand
          .toLowerCase()
          .includes(search)
    );


  if (matches.length === 0) {

    suggestionsBox.innerHTML = `

      <div style="
        padding:18px;
        text-align:center;
        color:var(--secondary-text);
        font-size:14px;
      ">

        No boots found

      </div>

    `;

    suggestionsBox.classList.add("show");

    return;

  }


  matches.forEach(
    boot => {

      const item =
        document.createElement("div");


      item.className =
        "suggestion";


      const imageHTML = boot.image

        ?

        `<img
          src="${boot.image}"
          alt="${boot.name}"
        >`

        :

        `<div class="suggestion-placeholder">
          Image<br>coming soon
        </div>`;


      item.innerHTML = `

        ${imageHTML}

        <div class="suggestion-info">

          <div class="suggestion-name">
            ${boot.name}
          </div>

          <div class="suggestion-brand">
            ${boot.brand}
          </div>

        </div>

      `;


      item.addEventListener(
        "click",
        function() {

          selectBoot(
            boot,
            selectionNumber
          );

        }
      );


      suggestionsBox.appendChild(item);

    }
  );


  suggestionsBox.classList.add("show");

}


/* =====================================================
   SELECT BOOT
===================================================== */

function selectBoot(
  boot,
  selectionNumber
) {

  if (selectionNumber === 1) {

    selectedBoot1 = boot;

    document
      .getElementById("search1")
      .value = "";

    document
      .getElementById("suggestions1")
      .classList
      .remove("show");

    showSelectedBoot(
      boot,
      "selected1"
    );

  }


  if (selectionNumber === 2) {

    selectedBoot2 = boot;

    document
      .getElementById("search2")
      .value = "";

    document
      .getElementById("suggestions2")
      .classList
      .remove("show");

    showSelectedBoot(
      boot,
      "selected2"
    );

  }

}


/* =====================================================
   SHOW SELECTED BOOT
===================================================== */

function showSelectedBoot(
  boot,
  elementId
) {

  const element =
    document.getElementById(
      elementId
    );


  const imageHTML = boot.image

    ?

    `<img
      src="${boot.image}"
      alt="${boot.name}"
    >`

    :

    `<div class="selected-placeholder">
      Image<br>coming soon
    </div>`;


  element.innerHTML = `

    ${imageHTML}

    <div class="selected-info">

      <div class="selected-name">
        ${boot.name}
      </div>

      <div class="selected-brand">
        ${boot.brand}
      </div>

    </div>

    <button
      class="remove-boot"
      onclick="removeBoot('${elementId}')"
      aria-label="Remove boot"
    >

      ×

    </button>

  `;


  element.classList.add("show");

}


/* =====================================================
   REMOVE BOOT
===================================================== */

function removeBoot(
  elementId
) {

  const element =
    document.getElementById(
      elementId
    );


  element.innerHTML = "";

  element.classList.remove("show");


  if (
    elementId === "selected1"
  ) {

    selectedBoot1 = null;

  }


  if (
    elementId === "selected2"
  ) {

    selectedBoot2 = null;

  }

}


/* =====================================================
   SEARCH EVENTS
===================================================== */

document
  .getElementById("search1")
  .addEventListener(
    "input",
    function() {

      showSuggestions(
        this,

        document.getElementById(
          "suggestions1"
        ),

        1
      );

    }
  );


document
  .getElementById("search2")
  .addEventListener(
    "input",
    function() {

      showSuggestions(
        this,

        document.getElementById(
          "suggestions2"
        ),

        2
      );

    }
  );


/* =====================================================
   FOCUS EVENTS
===================================================== */

document
  .getElementById("search1")
  .addEventListener(
    "focus",
    function() {

      showSuggestions(
        this,

        document.getElementById(
          "suggestions1"
        ),

        1
      );

    }
  );


document
  .getElementById("search2")
  .addEventListener(
    "focus",
    function() {

      showSuggestions(
        this,

        document.getElementById(
          "suggestions2"
        ),

        2
      );

    }
  );


/* =====================================================
   MOUSE GLOW
===================================================== */

const compareButton =
  document.getElementById(
    "compareButton"
  );


compareButton.addEventListener(
  "mousemove",
  function(event) {

    const rect =
      compareButton
        .getBoundingClientRect();


    const x =
      event.clientX -
      rect.left;


    const y =
      event.clientY -
      rect.top;


    compareButton.style.setProperty(
      "--mouse-x",
      x + "px"
    );


    compareButton.style.setProperty(
      "--mouse-y",
      y + "px"
    );

  }
);


/* =====================================================
   COMPARE
===================================================== */

compareButton.addEventListener(
  "click",
  function() {

    compareButton
      .classList
      .remove("neon");


    void compareButton.offsetWidth;


    compareButton
      .classList
      .add("neon");


    if (
      !selectedBoot1 ||
      !selectedBoot2
    ) {

      alert(
        "Please select two boots first."
      );

      return;

    }


    updateResult(
      selectedBoot1,
      1
    );


    updateResult(
      selectedBoot2,
      2
    );


    document
      .getElementById(
        "comparisonResult"
      )
      .classList
      .add("show");


    document
      .getElementById(
        "winner"
      )
      .textContent =

      "⚡ " +
      selectedBoot1.name +
      " vs " +
      selectedBoot2.name;

  }
);


/* =====================================================
   UPDATE RESULT
===================================================== */

function updateResult(
  boot,
  number
) {

  document
    .getElementById(
      "resultBoot" + number
    )
    .textContent =
    boot.name;


  document
    .getElementById(
      "speed" + number
    )
    .textContent =
    boot.speed;


  document
    .getElementById(
      "control" + number
    )
    .textContent =
    boot.control;


  document
    .getElementById(
      "comfort" + number
    )
    .textContent =
    boot.comfort;


  document
    .getElementById(
      "weight" + number
    )
    .textContent =
    boot.weight;


  document
    .getElementById(
      "price" + number
    )
    .textContent =
    boot.price;


  document
    .getElementById(
      "surface" + number
    )
    .textContent =
    boot.surface;


  document
    .getElementById(
      "technology" + number
    )
    .textContent =
    boot.technology;


  const image =
    document.getElementById(
      "resultImage" + number
    );


  const card =
    image.parentElement;


  const oldLink =
    card.querySelector(
      ".nike-product-link"
    );


  if (oldLink) {

    oldLink.remove();

  }


  if (boot.image) {

    image.src =
      boot.image;

    image.alt =
      boot.name;

    image.style.display =
      "block";

  }

  else {

    image.removeAttribute("src");

    image.style.display =
      "none";


    if (boot.productPage) {

      const nikeLink =
        document.createElement("a");


      nikeLink.className =
        "nike-product-link";


      nikeLink.href =
        boot.productPage;


      nikeLink.target =
        "_blank";


      nikeLink.rel =
        "noopener noreferrer";


      nikeLink.textContent =
        "View this boot →";


      card.insertBefore(
        nikeLink,
        image.nextSibling
      );

    }

  }

}


/* =====================================================
   CLOSE DROPDOWNS
===================================================== */

document.addEventListener(
  "click",
  function(event) {

    if (
      !event.target.closest(
        ".boot-selector"
      )
    ) {

      document
        .getElementById(
          "suggestions1"
        )
        .classList
        .remove("show");


      document
        .getElementById(
          "suggestions2"
        )
        .classList
        .remove("show");

    }

  }
);

</script>
