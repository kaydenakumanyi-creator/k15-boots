<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>K15 Football Boot Comparison</title>

<style>
:root {
    color-scheme: light dark;

    --bg: #f2f3f5;
    --card: rgba(255,255,255,0.85);
    --input: #ffffff;
    --text: #171717;
    --muted: #777;
    --border: rgba(0,0,0,0.12);
    --shadow: rgba(0,0,0,0.12);

    --button1: #eeeeee;
    --button2: #c7c9cc;
}

html[data-theme="dark"] {
    color-scheme: dark;

    --bg: #151515;
    --card: rgba(30,30,32,0.9);
    --input: #242426;
    --text: #f5f5f5;
    --muted: #aaa;
    --border: rgba(255,255,255,0.13);
    --shadow: rgba(0,0,0,0.45);

    --button1: #eeeeee;
    --button2: #bfc1c4;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    padding: 35px 20px 60px;

    font-family: Arial, Helvetica, sans-serif;

    color: var(--text);

    background:
        radial-gradient(circle at 15% 10%,
        rgba(255,255,255,.15),
        transparent 30%),
        radial-gradient(circle at 85% 90%,
        rgba(255,255,255,.08),
        transparent 30%),
        var(--bg);

    transition: background .3s ease, color .3s ease;
}

.container {
    width: 100%;
    max-width: 1100px;
    margin: auto;
}

/* =========================
   TOP
========================= */

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 30px;
}

.title {
    margin: 0;
    font-size: 30px;
    font-weight: 800;
}

.subtitle {
    margin-top: 6px;
    color: var(--muted);
    font-size: 14px;
}

.theme-button {
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);

    padding: 9px 15px;
    border-radius: 999px;

    cursor: pointer;

    backdrop-filter: blur(15px);

    transition: .2s ease;
}

.theme-button:hover {
    transform: translateY(-2px);
}

/* =========================
   BOOT SELECTION
========================= */

.boot-selection {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
}

.boot-selector {
    position: relative;
}

.boot-label {
    display: block;
    margin-bottom: 8px;

    font-size: 14px;
    font-weight: 700;
}

.search-wrapper {
    position: relative;
}

.boot-search {
    width: 100%;

    padding: 15px 16px;

    border: 1px solid var(--border);
    border-radius: 14px;

    background: var(--input);
    color: var(--text);

    font-size: 15px;

    outline: none;

    transition: .2s ease;
}

.boot-search:focus {
    border-color: rgba(255,255,255,.7);

    box-shadow:
        0 0 0 3px rgba(255,255,255,.08),
        0 8px 25px var(--shadow);
}

/* =========================
   SUGGESTIONS
========================= */

.suggestions {
    position: absolute;

    top: calc(100% + 7px);
    left: 0;
    right: 0;

    display: none;

    background: var(--card);

    border: 1px solid var(--border);
    border-radius: 15px;

    box-shadow: 0 15px 40px var(--shadow);

    overflow: hidden;

    z-index: 50;

    backdrop-filter: blur(15px);
}

.suggestions.show {
    display: block;
}

.suggestion {
    display: flex;
    align-items: center;

    gap: 12px;

    padding: 10px;

    cursor: pointer;

    transition: .15s ease;
}

.suggestion:hover {
    background: rgba(128,128,128,.12);
}

.suggestion img,
.suggestion-placeholder {
    width: 58px;
    height: 48px;

    object-fit: contain;

    border-radius: 9px;

    background: var(--input);

    flex-shrink: 0;
}

.suggestion-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;

    color: var(--muted);
    font-size: 10px;
}

.suggestion-info {
    min-width: 0;
}

.suggestion-name {
    font-size: 14px;
    font-weight: 700;
}

.suggestion-brand {
    margin-top: 4px;

    color: var(--muted);

    font-size: 12px;
}

/* =========================
   SELECTED BOOT
========================= */

.selected-boot {
    display: none;

    align-items: center;
    gap: 12px;

    margin-top: 10px;
    padding: 10px;

    border: 1px solid var(--border);
    border-radius: 14px;

    background: var(--card);

    backdrop-filter: blur(15px);
}

.selected-boot.show {
    display: flex;
}

.selected-boot img,
.selected-placeholder {
    width: 75px;
    height: 55px;

    object-fit: contain;

    border-radius: 9px;

    background: var(--input);

    flex-shrink: 0;
}

.selected-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;

    color: var(--muted);
    font-size: 10px;
}

.selected-info {
    flex: 1;
    min-width: 0;
}

.selected-name {
    font-size: 14px;
    font-weight: 700;
}

.selected-brand {
    margin-top: 4px;

    color: var(--muted);

    font-size: 12px;
}

.boot-page-link {
    display: inline-block;

    margin-top: 6px;

    color: var(--text);

    font-size: 11px;
    font-weight: 700;

    text-decoration: none;
}

.boot-page-link:hover {
    text-decoration: underline;
}

.remove-boot {
    border: none;
    background: transparent;

    color: var(--muted);

    font-size: 20px;

    cursor: pointer;
}

.remove-boot:hover {
    color: var(--text);
}

/* =========================
   COMPARE BUTTON
========================= */

.compare-container {
    display: flex;
    justify-content: center;

    margin: 28px 0 40px;
}

.compare-button {
    position: relative;

    overflow: hidden;

    border: 1px solid rgba(255,255,255,.35);
    border-radius: 14px;

    padding: 15px 38px;

    color: #111;

    background:
        linear-gradient(
            145deg,
            var(--button1),
            var(--button2)
        );

    font-size: 16px;
    font-weight: 800;

    cursor: pointer;

    box-shadow:
        0 8px 25px var(--shadow),
        0 0 15px rgba(255,255,255,.12);

    transition: .25s ease;
}

.compare-button:hover {
    transform: translateY(-3px);

    box-shadow:
        0 10px 30px var(--shadow),
        0 0 12px rgba(255,255,255,.5),
        0 0 30px rgba(255,255,255,.2);
}

.compare-button::before {
    content: "";

    position: absolute;

    width: 180px;
    height: 180px;

    left: var(--mouse-x, 50%);
    top: var(--mouse-y, 50%);

    transform: translate(-50%, -50%);

    background:
        radial-gradient(
            circle,
            rgba(255,255,255,.8),
            rgba(255,255,255,.2) 30%,
            transparent 70%
        );

    opacity: 0;

    pointer-events: none;

    transition: opacity .15s ease;
}

.compare-button:hover::before {
    opacity: 1;
}

.compare-button span {
    position: relative;
    z-index: 2;
}

/* Ripple */

.ripple {
    position: absolute;

    width: 10px;
    height: 10px;

    border-radius: 50%;

    background: rgba(255,255,255,.8);

    box-shadow:
        0 0 10px white,
        0 0 30px white,
        0 0 60px rgba(255,255,255,.5);

    transform: translate(-50%,-50%);

    animation: ripple .8s ease-out forwards;

    pointer-events: none;
}

@keyframes ripple {
    from {
        width: 10px;
        height: 10px;
        opacity: .9;
    }

    to {
        width: 500px;
        height: 500px;
        opacity: 0;
    }
}

/* =========================
   RESULTS
========================= */

.comparison-result {
    display: none;
}

.comparison-result.show {
    display: block;
    animation: fadeIn .5s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.boots {
    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(230px, 1fr));

    gap: 18px;
}

.boot-card {
    padding: 22px;

    border: 1px solid var(--border);
    border-radius: 18px;

    background: var(--card);

    box-shadow: 0 8px 25px var(--shadow);

    backdrop-filter: blur(15px);
}

.boot-card h2 {
    margin: 15px 0;

    font-size: 19px;
}

.result-image {
    width: 100%;
    height: 150px;

    object-fit: contain;

    border-radius: 12px;

    background: var(--input);
}

.stat {
    display: flex;
    justify-content: space-between;

    gap: 15px;

    padding: 12px 0;

    border-bottom: 1px solid var(--border);

    font-size: 14px;
}

.stat-name {
    color: var(--muted);
}

.stat-value {
    text-align: right;

    font-weight: 700;
}

.winner {
    margin-top: 22px;
    padding: 17px;

    border: 1px solid var(--border);
    border-radius: 14px;

    background: var(--card);

    text-align: center;

    font-weight: 700;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

    body {
        padding: 25px 14px 40px;
    }

    .top {
        align-items: flex-start;
    }

    .title {
        font-size: 24px;
    }

    .boot-selection {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="top">

        <div>
            <h1 class="title">K15 Football Boots</h1>

            <div class="subtitle">
                Compare your favourite football boots
            </div>
        </div>

        <button
            class="theme-button"
            id="themeButton"
            type="button">
            Theme: Auto
        </button>

    </div>


    <!-- =========================
         BOOT SELECTORS
    ========================== -->

    <div class="boot-selection">

        <div class="boot-selector">

            <label class="boot-label">
                Boot 1
            </label>

            <div class="search-wrapper">

                <input
                    class="boot-search"
                    id="search1"
                    type="text"
                    placeholder="Search for a boot..."
                    autocomplete="off">

                <div
                    class="suggestions"
                    id="suggestions1">
                </div>

            </div>

            <div
                class="selected-boot"
                id="selected1">
            </div>

        </div>


        <div class="boot-selector">

            <label class="boot-label">
                Boot 2
            </label>

            <div class="search-wrapper">

                <input
                    class="boot-search"
                    id="search2"
                    type="text"
                    placeholder="Search for a boot..."
                    autocomplete="off">

                <div
                    class="suggestions"
                    id="suggestions2">
                </div>

            </div>

            <div
                class="selected-boot"
                id="selected2">
            </div>

        </div>


        <div class="boot-selector">

            <label class="boot-label">
                Boot 3
            </label>

            <div class="search-wrapper">

                <input
                    class="boot-search"
                    id="search3"
                    type="text"
                    placeholder="Search for a boot..."
                    autocomplete="off">

                <div
                    class="suggestions"
                    id="suggestions3">
                </div>

            </div>

            <div
                class="selected-boot"
                id="selected3">
            </div>

        </div>


        <div class="boot-selector">

            <label class="boot-label">
                Boot 4
            </label>

            <div class="search-wrapper">

                <input
                    class="boot-search"
                    id="search4"
                    type="text"
                    placeholder="Search for a boot..."
                    autocomplete="off">

                <div
                    class="suggestions"
                    id="suggestions4">
                </div>

            </div>

            <div
                class="selected-boot"
                id="selected4">
            </div>

        </div>

    </div>


    <!-- =========================
         COMPARE BUTTON
    ========================== -->

    <div class="compare-container">

        <button
            class="compare-button"
            id="compareButton"
            type="button">

            <span>Compare Boots</span>

        </button>

    </div>


    <!-- =========================
         RESULTS
    ========================== -->

    <div
        class="comparison-result"
        id="comparisonResult">

        <div
            class="boots"
            id="resultsGrid">
        </div>

        <div
            class="winner"
            id="winner">
            ⚡ Select at least two boots above
        </div>

    </div>

</div>


<script>

/* =====================================================
   BOOT DATABASE

   Add new boots here.
===================================================== */

const boots = [

    {
        name: "Nike Mercurial Superfly 11 Elite FG",
        brand: "Nike Mercurial",

        image:
        "https://static.nike.com/a/images/t_web_pdp_535_v2/f_auto,u_9ddf04c7-2a9a-4d76-add1-d15af8f0263d,c_scale,fl_relative,w_1.0,h_1.0,fl_layer_apply/29dc7821-c782-4603-94d0-09334c0870ea/ZM+SUPERFLY+11+ELITE+FG.png",

        productPage:
        "https://www.nike.com/gb/t/mercurial-superfly-11-elite-firm-ground-low-top-football-boots-kSXagTAt/IF8507-101",

        speed: "10/10",
        control: "8.5/10",
        comfort: "8.5/10",
        traction: "9/10",

        surface: "Firm Ground",

        technology:
        "Air Zoom + Gripknit + FLEXGILITY"
    },


    {
        name: "Nike Mercurial Vapor 16 Elite FG",
        brand: "Nike Mercurial",

        image:
        "https://static.nike.com/a/images/t_web_pdp_535_v2/f_auto,q_auto/0b9b2c8e-3b6d-4c48-8c52-6a7c2f4c1e7e/ZM+VAPOR+16+ELITE+FG.png",

        productPage:
        "https://www.nike.com/gb/",

        speed: "10/10",
        control: "8/10",
        comfort: "8/10",
        traction: "9/10",

        surface: "Firm Ground",

        technology:
        "Air Zoom + Gripknit"
    },


    {
        name: "adidas F50 Elite FG",
        brand: "adidas F50",

        image:
        "https://assets.adidas.com/images/w_600,f_auto,q_auto/football_boot_placeholder.jpg",

        productPage:
        "https://www.adidas.co.uk/",

        speed: "10/10",
        control: "8/10",
        comfort: "8/10",
        traction: "9/10",

        surface: "Firm Ground",

        technology:
        "Fibertouch + Sprintframe"
    },


    {
        name: "adidas Predator Elite FG",
        brand: "adidas Predator",

        image:
        "https://assets.adidas.com/images/w_600,f_auto,q_auto/football_boot_placeholder.jpg",

        productPage:
        "https://www.adidas.co.uk/",

        speed: "8/10",
        control: "10/10",
        comfort: "9/10",
        traction: "9/10",

        surface: "Firm Ground",

        technology:
        "HybridTouch + Strikeskin"
    },


    {
        name: "PUMA FUTURE Ultimate FG",
        brand: "PUMA Future",

        image:
        "https://images.puma.com/image/upload/f_auto,q_auto/football_boot_placeholder.jpg",

        productPage:
        "https://uk.puma.com/",

        speed: "8.5/10",
        control: "9/10",
        comfort: "10/10",
        traction: "9/10",

        surface: "Firm Ground",

        technology:
        "FUZIONFIT + 3D grip zones"
    }

];


/* =====================================================
   SELECTED BOOTS
===================================================== */

const selectedBoots = [
    null,
    null,
    null,
    null
];


/* =====================================================
   SHOW SEARCH SUGGESTIONS
===================================================== */

function showSuggestions(input, box, number) {

    const search =
        input.value.toLowerCase().trim();

    box.innerHTML = "";

    if (!search) {
        box.classList.remove("show");
        return;
    }

    const matches =
        boots.filter(boot =>
            boot.name.toLowerCase().includes(search) ||
            boot.brand.toLowerCase().includes(search)
        );

    if (matches.length === 0) {

        box.innerHTML = `
            <div style="
                padding:18px;
                text-align:center;
                color:var(--muted);
                font-size:14px;
            ">
                No boots found
            </div>
        `;

        box.classList.add("show");

        return;
    }


    matches.forEach(boot => {

        const item =
            document.createElement("div");

        item.className = "suggestion";


        const image =
            boot.image
            ? `<img src="${boot.image}" alt="">`
            : `<div class="suggestion-placeholder">
                    IMAGE
               </div>`;


        item.innerHTML = `

            ${image}

            <div class="suggestion-info">

                <div class="suggestion-name">
                    ${boot.name}
                </div>

                <div class="suggestion-brand">
                    ${boot.brand}
                </div>

            </div>

        `;


        item.addEventListener("click", () => {

            selectBoot(boot, number);

        });


        box.appendChild(item);

    });


    box.classList.add("show");
}


/* =====================================================
   SELECT BOOT
===================================================== */

function selectBoot(boot, number) {

    const index = number - 1;

    selectedBoots[index] = boot;

    document.getElementById(
        "search" + number
    ).value = "";

    document.getElementById(
        "suggestions" + number
    ).classList.remove("show");

    showSelectedBoot(boot, number);
}


/* =====================================================
   DISPLAY SELECTED BOOT
===================================================== */

function showSelectedBoot(boot, number) {

    const element =
        document.getElementById(
            "selected" + number
        );


    const image =
        boot.image
        ? `<img src="${boot.image}" alt="${boot.name}">`
        : `<div class="selected-placeholder">
                IMAGE
           </div>`;


    element.innerHTML = `

        ${image}

        <div class="selected-info">

            <div class="selected-name">
                ${boot.name}
            </div>

            <div class="selected-brand">
                ${boot.brand}
            </div>

            <a
                class="boot-page-link"
                href="${boot.productPage}"
                target="_blank"
                rel="noopener noreferrer">

                View boot page →

            </a>

        </div>


        <button
            class="remove-boot"
            type="button">

            ×

        </button>

    `;


    element
        .querySelector(".remove-boot")
        .addEventListener("click", () => {

            removeBoot(number);

        });


    element.classList.add("show");
}


/* =====================================================
   REMOVE BOOT
===================================================== */

function removeBoot(number) {

    const index = number - 1;

    selectedBoots[index] = null;

    const element =
        document.getElementById(
            "selected" + number
        );

    element.innerHTML = "";

    element.classList.remove("show");
}


/* =====================================================
   SEARCH EVENTS
===================================================== */

for (let i = 1; i <= 4; i++) {

    const input =
        document.getElementById(
            "search" + i
        );

    const suggestions =
        document.getElementById(
            "suggestions" + i
        );


    input.addEventListener(
        "input",
        function() {

            showSuggestions(
                this,
                suggestions,
                i
            );

        }
    );

}


/* =====================================================
   CLOSE SUGGESTIONS
===================================================== */

document.addEventListener(
    "click",
    function(event) {

        if (
            !event.target.closest(
                ".boot-selector"
            )
        ) {

            for (let i = 1; i <= 4; i++) {

                document
                    .getElementById(
                        "suggestions" + i
                    )
                    .classList.remove("show");

            }

        }

    }
);


/* =====================================================
   COMPARE BUTTON MOUSE GLOW
===================================================== */

const compareButton =
    document.getElementById(
        "compareButton"
    );


compareButton.addEventListener(
    "mousemove",
    function(event) {

        const rect =
            compareButton.getBoundingClientRect();


        compareButton.style.setProperty(
            "--mouse-x",
            (event.clientX - rect.left) + "px"
        );


        compareButton.style.setProperty(
            "--mouse-y",
            (event.clientY - rect.top) + "px"
        );

    }
);


/* =====================================================
   RIPPLE EFFECT
===================================================== */

compareButton.addEventListener(
    "click",
    function(event) {

        const rect =
            compareButton.getBoundingClientRect();


        const ripple =
            document.createElement("span");


        ripple.className = "ripple";


        ripple.style.left =
            (event.clientX - rect.left) + "px";


        ripple.style.top =
            (event.clientY - rect.top) + "px";


        compareButton.appendChild(ripple);


        setTimeout(() => {

            ripple.remove();

        }, 800);

    }
);


/* =====================================================
   CREATE RESULT CARD
===================================================== */

function createResultCard(boot) {

    const image =
        boot.image
        ? `<img
                class="result-image"
                src="${boot.image}"
                alt="${boot.name}">`

        : `<div class="result-image">
                Image coming soon
           </div>`;


    return `

        <div class="boot-card">

            ${image}


            <h2>
                ${boot.name}
            </h2>


            <div class="stat">

                <span class="stat-name">
                    Speed
                </span>

                <span class="stat-value">
                    ${boot.speed}
                </span>

            </div>


            <div class="stat">

                <span class="stat-name">
                    Control
                </span>

                <span class="stat-value">
                    ${boot.control}
                </span>

            </div>


            <div class="stat">

                <span class="stat-name">
                    Comfort
                </span>

                <span class="stat-value">
                    ${boot.comfort}
                </span>

            </div>


            <div class="stat">

                <span class="stat-name">
                    Traction
                </span>

                <span class="stat-value">
                    ${boot.traction}
                </span>

            </div>


            <div class="stat">

                <span class="stat-name">
                    Surface
                </span>

                <span class="stat-value">
                    ${boot.surface}
                </span>

            </div>


            <div class="stat">

                <span class="stat-name">
                    Technology
                </span>

                <span class="stat-value">
                    ${boot.technology}
                </span>

            </div>


            <a
                class="boot-page-link"
                href="${boot.productPage}"
                target="_blank"
                rel="noopener noreferrer">

                View boot page →

            </a>

        </div>

    `;
}


/* =====================================================
   COMPARE BOOTS
===================================================== */

compareButton.addEventListener(
    "click",
    function() {

        const chosen =
            selectedBoots.filter(Boolean);


        if (chosen.length < 2) {

            alert(
                "Please select at least two boots first."
            );

            return;

        }


        document.getElementById(
            "resultsGrid"
        ).innerHTML =

            chosen
                .map(boot =>
                    createResultCard(boot)
                )
                .join("");


        document.getElementById(
            "comparisonResult"
        ).classList.add("show");


        document.getElementById(
            "winner"
        ).textContent =

            "⚡ Comparing " +
            chosen
                .map(boot => boot.name)
                .join(" vs ");

    }
);


/* =====================================================
   THEME
===================================================== */

const themeButton =
    document.getElementById(
        "themeButton"
    );


let themeMode =
    localStorage.getItem(
        "bootComparisonTheme"
    ) || "auto";


function applyTheme() {

    if (themeMode === "auto") {

        document.documentElement
            .removeAttribute("data-theme");

        themeButton.textContent =
            "Theme: Auto";

    }

    else {

        document.documentElement
            .setAttribute(
                "data-theme",
                themeMode
            );

        themeButton.textContent =
            themeMode === "dark"
            ? "Theme: Dark"
            : "Theme: Light";

    }

}


themeButton.addEventListener(
    "click",
    function() {

        if (themeMode === "auto") {

            themeMode = "light";

        }

        else if (themeMode === "light") {

            themeMode = "dark";

        }

        else {

            themeMode = "auto";

        }


        localStorage.setItem(
            "bootComparisonTheme",
            themeMode
        );


        applyTheme();

    }
);


applyTheme();

</script>

</body>
</html>
